<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9f4ed"><title>Habit Log</title>
<style>
:root{--green:#2f7654;--green2:#e4f1e8;--mint:#f3f8f4;--ink:#20352a;--muted:#718078;--line:#dce8df;--white:#fff;--red:#b94d4d;--shadow:0 5px 18px #244b3510}*{box-sizing:border-box}body{margin:0;background:#f5f8f5;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;padding-bottom:84px}header{padding:22px 18px 14px;background:linear-gradient(135deg,#e4f1e8,#f7faf7);border-bottom:1px solid var(--line)}header h1{margin:0;font-size:23px;color:var(--green)}header p{margin:5px 0 0;font-size:12px;color:var(--muted)}main{max-width:850px;margin:auto;padding:15px}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:#fffffff2;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.tab{border:0;background:none;color:#718078;font-size:10px;padding:5px 1px;display:flex;flex-direction:column;align-items:center;gap:3px}.tab b{font-size:19px;font-weight:500}.tab.active{color:var(--green);font-weight:700}.page{display:none}.page.active{display:block}.section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 13px}.section-title h2{font-size:19px;margin:0}.muted{color:var(--muted);font-size:12px}.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{display:flex;align-items:center;justify-content:space-between;gap:8px}.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:115px;margin:5px 0}.field label{font-size:11px;color:var(--muted)}input,select,textarea{font:inherit;color:var(--ink);background:#fbfdfb;border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}textarea{min-height:72px;resize:vertical}button{font:inherit;cursor:pointer}.btn{border:0;border-radius:10px;padding:9px 12px;background:var(--green);color:white;font-size:12px;font-weight:650}.btn.light{background:var(--green2);color:var(--green)}.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}.btn.danger{background:#faeeee;color:var(--red)}.btn.small{padding:6px 9px;font-size:11px}.pill{font-size:10px;padding:4px 8px;border-radius:20px;background:var(--green2);color:var(--green)}.todo{display:flex;align-items:flex-start;gap:10px;padding:11px 2px;border-bottom:1px solid #edf2ee}.todo:last-child{border:0}.todo input[type=checkbox]{width:20px;height:20px;accent-color:var(--green);margin:1px 0}.todo .name{flex:1;font-size:14px;overflow-wrap:anywhere}.done .name{text-decoration:line-through;color:#9aa69e}.todo small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.empty{text-align:center;color:var(--muted);font-size:13px;padding:24px 8px}.goal{border:1px solid var(--line);border-radius:13px;margin:9px 0;background:#fff;overflow:hidden}.goal-head{display:flex;align-items:center;gap:7px;padding:11px}.goal-title{flex:1;font-weight:700;font-size:14px;overflow-wrap:anywhere}.goal-body{padding:0 12px 12px 28px}.node{border-left:2px solid #d8e8dc;margin-left:5px;padding:5px 0 5px 12px}.node-row{display:flex;align-items:center;gap:6px}.node-label{flex:1;font-size:13px;overflow-wrap:anywhere}.node-children{margin-left:9px}.iconbtn{border:0;background:none;color:var(--muted);padding:4px;font-size:15px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{background:var(--mint);border-radius:13px;padding:13px}.stat strong{display:block;font-size:23px;color:var(--green)}.stat span{font-size:11px;color:var(--muted)}.bar{height:8px;background:#edf2ee;border-radius:9px;overflow:hidden;margin:7px 0}.bar i{display:block;height:100%;background:#6ba982;border-radius:9px}.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{background:#f7faf7;border-radius:8px;min-height:44px;padding:5px 2px;text-align:center;font-size:10px}.day.today{outline:2px solid var(--green)}.day em{display:block;font-style:normal;font-size:9px;color:var(--green);margin-top:3px}.dayhead{font-size:10px;text-align:center;color:var(--muted)}.hidden{display:none!important}.subtle{font-size:11px;color:var(--muted)}.divider{height:1px;background:var(--line);margin:12px 0}.notice{background:#f1f7f2;border-radius:10px;padding:10px;font-size:11px;color:#587363;line-height:1.6}.actions{display:flex;gap:5px;flex-wrap:wrap}.goal-actions{display:flex;gap:5px}.monthly-item{padding:11px 0;border-bottom:1px solid #edf2ee}.monthly-item:last-child{border:0}.progress-label{font-size:11px;color:var(--muted)}
</style></head><body>
<header><h1>🌱 Habit Log</h1><p>毎日の小さな行動を、大きな目標につなげる</p></header><main>
<section id="today" class="page active"><div class="section-title"><h2>今日のToDo</h2><span class="pill" id="todayDate"></span></div><div class="card"><div class="row"><div class="field"><label>ToDoを追加</label><input id="todoInput" placeholder="今日やることを入力"></div><div class="field" style="max-width:130px"><label>カテゴリー</label><select id="todoCategory"></select></div><button class="btn" style="align-self:end" onclick="addTodo()">追加</button></div></div><div class="card"><div class="between"><b>今日のリスト</b><span class="muted" id="todayCount"></span></div><div id="todayList"></div></div><div class="card"><b>月間ToDoから追加</b><p class="muted">月間ToDoを選ぶと、今日のリストに追加できます。</p><div id="monthlyPicker"></div></div></section>
<section id="monthly" class="page"><div class="section-title"><h2>月間ToDo</h2><span class="pill" id="monthLabel"></span></div><div class="card"><b>月間ToDoを作成</b><div class="field"><label>内容</label><input id="monthlyInput" placeholder="例：英語を20回勉強する"></div><div class="row"><div class="field"><label>月間目標回数</label><input id="monthlyTarget" type="number" min="1" value="12"></div><div class="field"><label>カテゴリー</label><select id="monthlyCategory"></select></div><div class="field"><label>アイコン</label><select id="monthlyIcon"><option>🎯</option><option>📚</option><option>💪</option><option>🏡</option><option>💰</option><option>🌱</option><option>🧹</option><option>✍️</option><option>⭐</option></select></div></div><div class="field"><label>自動登録</label><select id="monthlyRepeat"><option value="none">なし（必要な日に手動追加）</option><option value="daily">毎日</option><option value="weekday">選択した曜日</option></select></div><div id="weekdayOptions" class="row hidden">月〜日 <span id="weekdayChecks"></span></div><button class="btn" onclick="addMonthly()">月間ToDoを登録</button></div><div class="card"><div class="between"><b>今月の進捗</b><span id="monthlyTotal" class="muted"></span></div><div id="monthlyList"></div></div></section>
<section id="home" class="page"><div class="section-title"><h2>大きな目標</h2><button class="btn" onclick="addGoal()">＋ 目標を追加</button></div><div class="notice">目標を起点に、行動を階層的に整理できます。行動は何段階でも追加でき、月間ToDoとして登録できます。</div><div id="goalList"></div></section>
<section id="analysis" class="page"><div class="section-title"><h2>分析</h2><span class="pill" id="analysisMonth"></span></div><div class="stats" id="stats"></div><div class="card"><b>今月の日別達成率</b><div id="calendar" style="margin-top:12px"></div></div><div class="card"><b>カテゴリー別達成率</b><div id="categoryAnalysis"></div></div><div class="card"><b>月間ToDoの進捗</b><div id="goalAnalysis"></div></div></section>
<section id="reflection" class="page"><div class="section-title"><h2>振り返り</h2><span class="pill" id="reflectionDate"></span></div><div class="card"><b>今日の振り返り</b><div class="field"><label>できたこと</label><textarea id="reflectionGood" placeholder="今日できたこと、続けられたこと"></textarea></div><div class="field"><label>気づき・改善したいこと</label><textarea id="reflectionImprove" placeholder="明日に活かしたいこと"></textarea></div><div class="field"><label>明日の自分への一言</label><input id="reflectionNext" placeholder="明日やること、意識したいこと"></div><button class="btn" onclick="saveReflection()">振り返りを保存</button><div id="reflectionSaved" class="subtle" style="margin-top:8px"></div></div><div class="card"><b>データ管理</b><p class="muted">機種変更・ブラウザのデータ削除に備えて、定期的にバックアップしてください。</p><div class="actions"><button class="btn light" onclick="exportData()">JSONバックアップ</button><button class="btn light" onclick="document.getElementById('importFile').click()">復元</button><button class="btn ghost" onclick="exportCSV()">CSV出力</button><input id="importFile" type="file" accept="application/json" class="hidden" onchange="importData(event)"></div><div class="divider"></div><b>カテゴリー管理</b><div class="row"><div class="field"><label>カテゴリー名</label><input id="newCategory" placeholder="例：健康"></div><button class="btn" style="align-self:end" onclick="addCategory()">追加</button></div><div id="categoryList" class="actions"></div></div></section>
</main><nav class="tabs"><button class="tab active" data-page="today" onclick="showPage('today')"><b>☑</b>今日</button><button class="tab" data-page="monthly" onclick="showPage('monthly')"><b>▦</b>月間</button><button class="tab" data-page="home" onclick="showPage('home')"><b>◎</b>ホーム</button><button class="tab" data-page="analysis" onclick="showPage('analysis')"><b>▥</b>分析</button><button class="tab" data-page="reflection" onclick="showPage('reflection')"><b>✎</b>振り返り</button></nav>
<script>
const KEY='habit-log-integrated-v3';const todayKey=()=>new Date().toISOString().slice(0,10);const monthKey=()=>todayKey().slice(0,7);const uid=()=>Math.random().toString(36).slice(2,10);const days=['日','月','火','水','木','金','土'];
let db={todos:[],monthly:[],goals:[],categories:['学習','運動','家庭菜園','お金','読書','家事','その他'],reflections:{},settings:{}};
// IndexedDB is the primary store; localStorage is a compatibility fallback.
let idb=null;function openDB(){return new Promise((resolve)=>{if(!('indexedDB'in window)){resolve(null);return}let r=indexedDB.open('HabitLogDB',1);r.onupgradeneeded=()=>r.result.createObjectStore('data');r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null)})}
async function load(){idb=await openDB();if(idb){try{let value=await new Promise((res,rej)=>{let tx=idb.transaction('data','readonly');let q=tx.objectStore('data').get('main');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});if(value)db=value;else{let old=localStorage.getItem(KEY);if(old){db=JSON.parse(old);await persist()}}}catch(e){}}else{try{let old=localStorage.getItem(KEY);if(old)db=JSON.parse(old)}catch(e){}}db.todos??=[];db.monthly??=[];db.goals??=[];db.categories??=['学習','運動','家庭菜園','お金','読書','家事','その他'];db.reflections??={};render()}
async function persist(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}if(idb){try{await new Promise((res,rej)=>{let tx=idb.transaction('data','readwrite');tx.objectStore('data').put(db,'main');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}}
function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.page===id));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function catOptions(selected=''){return db.categories.map(c=>`<option ${c===selected?'selected':''}>${esc(c)}</option>`).join('')}
function render(){let d=todayKey(),m=monthKey();document.getElementById('todayDate').textContent=d;document.getElementById('monthLabel').textContent=m;document.getElementById('analysisMonth').textContent=m;document.getElementById('reflectionDate').textContent=d;['todoCategory','monthlyCategory'].forEach(id=>document.getElementById(id).innerHTML=catOptions());renderToday();renderMonthly();renderGoals();renderAnalysis();renderReflection();renderCategories()}
function renderToday(){let list=db.todos.filter(t=>t.date===todayKey());let done=list.filter(t=>t.done).length;document.getElementById('todayCount').textContent=`${done}/${list.length} 完了`;document.getElementById('todayList').innerHTML=list.length?list.map(t=>`<div class="todo ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTodo('${t.id}',this.checked)"><div class="name">${esc(t.title)}<small>${esc(t.category||'未分類')}${t.monthlyId?' · 月間ToDo':''}</small></div><button class="iconbtn" onclick="deleteTodo('${t.id}')">×</button></div>`).join(''):'<div class="empty">今日のToDoはまだありません</div>';let available=db.monthly.filter(x=>!db.todos.some(t=>t.date===todayKey()&&t.monthlyId===x.id));document.getElementById('monthlyPicker').innerHTML=available.length?available.map(x=>`<div class="between" style="padding:7px 0"><span>${esc(x.icon)} ${esc(x.title)}</span><button class="btn small light" onclick="addMonthlyToToday('${x.id}')">今日に追加</button></div>`).join(''):'<div class="empty">追加できる月間ToDoはありません</div>'}
function addTodo(){let v=document.getElementById('todoInput').value.trim();if(!v)return;db.todos.push({id:uid(),title:v,category:document.getElementById('todoCategory').value,date:todayKey(),done:false});document.getElementById('todoInput').value='';persist().then(render)}function toggleTodo(id,done){let t=db.todos.find(x=>x.id===id);if(t){t.done=done;t.completedAt=done?new Date().toISOString():null}persist().then(render)}function deleteTodo(id){if(confirm('このToDoを削除しますか？')){db.todos=db.todos.filter(x=>x.id!==id);persist().then(render)}}
function addMonthly(){let title=document.getElementById('monthlyInput').value.trim();if(!title)return;let repeat=document.getElementById('monthlyRepeat').value;let weekdays=[...document.querySelectorAll('[name=weekday]:checked')].map(x=>+x.value);db.monthly.push({id:uid(),title,target:Math.max(1,+document.getElementById('monthlyTarget').value||1),category:document.getElementById('monthlyCategory').value,icon:document.getElementById('monthlyIcon').value,repeat,weekdays,created:monthKey(),goalId:null});document.getElementById('monthlyInput').value='';persist().then(render)}
function addMonthlyToToday(id){let x=db.monthly.find(x=>x.id===id);if(!x||db.todos.some(t=>t.date===todayKey()&&t.monthlyId===id))return;db.todos.push({id:uid(),title:x.title,category:x.category,date:todayKey(),done:false,monthlyId:id});persist().then(render)}function monthlyDone(x){return db.todos.filter(t=>t.monthlyId===x.id&&t.done&&t.date.startsWith(monthKey())).length}
function renderMonthly(){let items=db.monthly;document.getElementById('monthlyTotal').textContent=`${items.length} 件`;document.getElementById('monthlyList').innerHTML=items.length?items.map(x=>{let n=monthlyDone(x),p=Math.min(100,Math.round(n/x.target*100));return `<div class="monthly-item"><div class="between"><b>${esc(x.icon)} ${esc(x.title)}</b><div class="actions"><button class="btn small light" onclick="addMonthlyToToday('${x.id}')">今日に追加</button><button class="iconbtn" onclick="editMonthly('${x.id}')">✎</button><button class="iconbtn" onclick="removeMonthly('${x.id}')">×</button></div></div><div class="progress-label">${n} / ${x.target} 回 · ${esc(x.category)} · ${x.repeat==='daily'?'毎日':x.repeat==='weekday'?'曜日指定':'手動'}</div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join(''):'<div class="empty">月間ToDoを登録しましょう</div>'}
function editMonthly(id){let x=db.monthly.find(x=>x.id===id);let v=prompt('月間ToDoの名前',x.title);if(v===null)return;if(v.trim())x.title=v.trim();let n=prompt('月間目標回数',x.target);if(n!==null)x.target=Math.max(1,+n||1);persist().then(render)}function removeMonthly(id){if(confirm('月間ToDoを削除しますか？（過去の記録は残ります）')){db.monthly=db.monthly.filter(x=>x.id!==id);persist().then(render)}}
document.getElementById('monthlyRepeat').addEventListener('change',e=>document.getElementById('weekdayOptions').classList.toggle('hidden',e.target.value!=='weekday'));document.getElementById('weekdayChecks').innerHTML=days.map((d,i)=>`<label style="display:inline-flex;align-items:center;gap:2px;margin:4px;font-size:11px"><input type="checkbox" name="weekday" value="${i}" ${i>0&&i<6?'checked':''} style="width:auto">${d}</label>`).join('');
function addGoal(){let title=prompt('大きな目標を入力してください');if(!title?.trim())return;db.goals.push({id:uid(),title:title.trim(),nodes:[],collapsed:false,archived:false});persist().then(render)}function addNode(goalId,parentId=null){let title=prompt('行動・小目標を入力してください');if(!title?.trim())return;let g=db.goals.find(x=>x.id===goalId);let node={id:uid(),title:title.trim(),children:[],collapsed:false};if(parentId){let p=findNode(g.nodes,parentId);p.children.push(node)}else g.nodes.push(node);persist().then(render)}function findNode(nodes,id){for(let n of nodes){if(n.id===id)return n;let f=findNode(n.children||[],id);if(f)return f}return null}
function renderNode(g,n,depth=0){return `<div class="node"><div class="node-row"><span class="node-label">${esc(n.title)}</span><button class="iconbtn" title="子の行動を追加" onclick="addNode('${g.id}','${n.id}')">＋</button><button class="iconbtn" onclick="registerNode('${g.id}','${n.id}')" title="月間ToDoに登録">▦</button><button class="iconbtn" onclick="editNode('${g.id}','${n.id}')">✎</button><button class="iconbtn" onclick="moveNode('${g.id}','${n.id}',${depth})">↕</button><button class="iconbtn" onclick="deleteNode('${g.id}','${n.id}')">×</button></div>${n.children?.length?`<div class="node-children">${n.children.map(c=>renderNode(g,c,depth+1)).join('')}</div>`:''}</div>`}
function renderGoals(){let gs=db.goals.filter(g=>!g.archived);document.getElementById('goalList').innerHTML=gs.length?gs.map((g,i)=>`<div class="goal"><div class="goal-head"><span>🌳</span><span class="goal-title">${esc(g.title)}</span><div class="goal-actions"><button class="btn small light" onclick="addNode('${g.id}')">＋ 行動</button><button class="iconbtn" onclick="editGoal('${g.id}')">✎</button><button class="iconbtn" onclick="moveGoal('${g.id}',-1)">↑</button><button class="iconbtn" onclick="moveGoal('${g.id}',1)">↓</button><button class="iconbtn" onclick="archiveGoal('${g.id}')">▣</button></div></div><div class="goal-body">${g.nodes.length?g.nodes.map(n=>renderNode(g,n)).join(''):'<span class="muted">行動リストはまだありません</span>'}</div></div>`).join(''):'<div class="empty">大きな目標を追加して、行動を整理しましょう</div>'}
function editGoal(id){let g=db.goals.find(x=>x.id===id),v=prompt('目標名',g.title);if(v?.trim()){g.title=v.trim();persist().then(render)}}function moveGoal(id,dir){let i=db.goals.findIndex(x=>x.id===id),j=i+dir;if(j<0||j>=db.goals.length)return;[db.goals[i],db.goals[j]]=[db.goals[j],db.goals[i]];persist().then(render)}function archiveGoal(id){let g=db.goals.find(x=>x.id===id);if(confirm('この目標をアーカイブしますか？')){g.archived=true;persist().then(render)}}function editNode(gid,nid){let n=findNode(db.goals.find(x=>x.id===gid).nodes,nid),v=prompt('行動名',n.title);if(v?.trim()){n.title=v.trim();persist().then(render)}}function deleteNode(gid,nid){if(!confirm('この行動と子項目を削除しますか？'))return;let g=db.goals.find(x=>x.id===gid);function del(arr){let i=arr.findIndex(x=>x.id===nid);if(i>=0)arr.splice(i,1);else arr.forEach(x=>del(x.children||[]))}del(g.nodes);persist().then(render)}function moveNode(gid,nid){let g=db.goals.find(x=>x.id===gid);function mv(arr){let i=arr.findIndex(x=>x.id===nid);if(i<0){for(let x of arr)if(mv(x.children||[]))return true;return false}if(i>0)[arr[i-1],arr[i]]=[arr[i],arr[i-1]];else if(i<arr.length-1)[arr[i],arr[i+1]]=[arr[i+1],arr[i]];return true}mv(g.nodes);persist().then(render)}function registerNode(gid,nid){let g=db.goals.find(x=>x.id===gid),n=findNode(g.nodes,nid);db.monthly.push({id:uid(),title:n.title,target:4,category:'その他',icon:'🌱',repeat:'none',weekdays:[],created:monthKey(),goalId:gid,nodeId:nid});persist().then(()=>{render();showPage('monthly')})}
function renderAnalysis(){let m=monthKey(),ts=db.todos.filter(t=>t.date.startsWith(m)),done=ts.filter(t=>t.done).length,rate=ts.length?Math.round(done/ts.length*100):0;let dates=[...new Set(db.todos.map(t=>t.date))].sort();let streak=0;for(let d=todayKey();;){let a=db.todos.filter(t=>t.date===d);if(!a.length||!a.every(t=>t.done))break;streak++;let dt=new Date(d+'T12:00:00');dt.setDate(dt.getDate()-1);d=dt.toISOString().slice(0,10)}document.getElementById('stats').innerHTML=`<div class="stat"><strong>${rate}%</strong><span>今月の達成率</span></div><div class="stat"><strong>${streak}日</strong><span>連続達成日数</span></div><div class="stat"><strong>${done}</strong><span>今月の完了数</span></div><div class="stat"><strong>${db.monthly.length}</strong><span>月間ToDo数</span></div>`;let [y,mo]=m.split('-').map(Number),count=new Date(y,mo,0).getDate(),first=new Date(y,mo-1,1).getDay(),html='<div class="month-grid">'+days.map(d=>`<div class="dayhead">${d}</div>`).join('');for(let i=0;i<first;i++)html+='<div></div>';for(let d=1;d<=count;d++){let key=`${m}-${String(d).padStart(2,'0')}`,a=db.todos.filter(t=>t.date===key),n=a.filter(t=>t.done).length,p=a.length?Math.round(n/a.length*100):0;html+=`<div class="day ${key===todayKey()?'today':''}">${d}${a.length?`<em>${p}%</em>`:''}</div>`}document.getElementById('calendar').innerHTML=html+'</div>';let cats=db.categories;document.getElementById('categoryAnalysis').innerHTML=cats.map(c=>{let a=ts.filter(t=>t.category===c),n=a.filter(t=>t.done).length,p=a.length?Math.round(n/a.length*100):0;return `<div style="margin:10px 0"><div class="between"><span>${esc(c)}</span><span class="muted">${n}/${a.length} · ${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('');document.getElementById('goalAnalysis').innerHTML=db.monthly.map(x=>`<div class="between" style="padding:6px 0"><span>${esc(x.icon)} ${esc(x.title)}</span><b>${monthlyDone(x)}/${x.target}</b></div>`).join('')||'<div class="empty">月間ToDoがありません</div>'}
function saveReflection(){db.reflections[todayKey()]={good:document.getElementById('reflectionGood').value,improve:document.getElementById('reflectionImprove').value,next:document.getElementById('reflectionNext').value};persist().then(()=>document.getElementById('reflectionSaved').textContent='保存しました')};function renderReflection(){let r=db.reflections[todayKey()]||{};document.getElementById('reflectionGood').value=r.good||'';document.getElementById('reflectionImprove').value=r.improve||'';document.getElementById('reflectionNext').value=r.next||''}
function addCategory(){let v=document.getElementById('newCategory').value.trim();if(!v||db.categories.includes(v))return;db.categories.push(v);document.getElementById('newCategory').value='';persist().then(render)}function renderCategories(){document.getElementById('categoryList').innerHTML=db.categories.map(c=>`<span class="pill">${esc(c)} <button class="iconbtn" style="padding:0 0 0 4px" onclick="removeCategory('${esc(c)}')">×</button></span>`).join('');document.getElementById('todoCategory').innerHTML=catOptions();document.getElementById('monthlyCategory').innerHTML=catOptions()}function removeCategory(c){if(db.categories.length<=1)return alert('カテゴリーは最低1つ必要です');if(confirm(`「${c}」を削除しますか？既存記録は残ります。`)){db.categories=db.categories.filter(x=>x!==c);persist().then(render)}}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='habit-log-backup-'+todayKey()+'.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.todos||!x.monthly||!x.goals)throw Error();if(confirm('現在のデータをバックアップ内容で置き換えますか？')){db=x;persist().then(render)}}catch(err){alert('読み込めるバックアップファイルではありません')}e.target.value=''};r.readAsText(f)}function exportCSV(){let rows=[['date','title','category','done','monthlyId'],...db.todos.map(t=>[t.date,t.title,t.category,t.done?'1':'0',t.monthlyId||''])];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='habit-log-todos-'+todayKey()+'.csv';a.click();URL.revokeObjectURL(a.href)}
// Auto-add recurring monthly items for today's date, without duplicates.
function applyRepeats(){let d=new Date(),weekday=d.getDay(),date=todayKey();for(let x of db.monthly){let applies=x.repeat==='daily'||(x.repeat==='weekday'&&(x.weekdays||[]).includes(weekday));if(applies&&!db.todos.some(t=>t.date===date&&t.monthlyId===x.id))db.todos.push({id:uid(),title:x.title,category:x.category,date,done:false,monthlyId:x.id})}persist()}
load().then(()=>applyRepeats().then(render));
</script></body></html>
