<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f2">
<title>Habit Log</title>
<style>
:root {
  --site-primary: #315c4b;
  --site-on-primary: #ffffff;
  --site-secondary: #e5ede7;
  --site-on-secondary: #244536;
  --site-background: #f4f6f2;
  --site-on-background: #202923;
  --site-font-body: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  --site-font-heading: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  --site-heading-scale: 1;
  --site-spacing-scale: 1;
  --site-radius-scale: 1;
  --site-decoration-opacity: 1;
  color-scheme: light dark;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--site-font-body); background: var(--site-background); color: var(--site-on-background); }
#app { min-height: 100vh; background-color: var(--site-background); color: var(--site-on-background); padding-bottom: calc(86px + env(safe-area-inset-bottom)); }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
.topbar { background: var(--site-primary); color: var(--site-on-primary); padding: 22px 20px 24px; }
.topline { display:flex; align-items:center; justify-content:space-between; max-width:760px; margin:auto; }
.brand { font-family:var(--site-font-heading); font-size:calc(22px * var(--site-heading-scale)); font-weight:800; letter-spacing:.02em; }
.subbrand { opacity:.78; font-size:12px; margin-top:3px; }
.month-nav { display:flex; align-items:center; gap:12px; }
.month-nav button { border:1px solid #ffffff55; background:#ffffff15; color:white; border-radius:10px; width:34px; height:34px; }
main { width:min(100% - 28px, 720px); margin: -10px auto 0; }
.tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; background:var(--site-secondary); padding:5px; border-radius:16px; position:sticky; top:0; z-index:5; }
.tab { border:0; background:transparent; color:var(--site-on-secondary); padding:10px 3px; border-radius:12px; font-size:12px; font-weight:700; }
.tab.active { background:var(--site-primary); color:var(--site-on-primary); box-shadow:0 2px 8px #00000015; }
.tab span { display:block; font-size:17px; margin-bottom:3px; }
.panel { padding:18px 0 10px; }
.section-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin:8px 0 14px; }
h1 { font-size:calc(23px * var(--site-heading-scale)); margin:0; letter-spacing:-.03em; }
h2 { font-size:16px; margin:0; }
.muted { color:light-dark(#718078,#a8b4ad); }
.small { font-size:12px; }
.card { background:light-dark(#ffffff,#202a24); border:1px solid light-dark(#e4e9e3,#354139); border-radius:calc(18px * var(--site-radius-scale)); padding:16px; margin-bottom:12px; box-shadow:0 4px 16px #17291d08; }
.summary-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin-bottom:12px; }
.metric { background:var(--site-secondary); border-radius:14px; padding:13px 10px; color:var(--site-on-secondary); }
.metric strong { display:block; font-size:23px; letter-spacing:-.04em; }
.metric span { font-size:11px; opacity:.8; }
.progress { height:8px; border-radius:99px; background:light-dark(#e8eee8,#37433b); overflow:hidden; }
.progress > i { display:block; height:100%; background:#4d9471; border-radius:99px; }
.goal-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid light-dark(#edf0ec,#354139); }
.goal-row:last-child { border-bottom:0; padding-bottom:0; }
.goal-icon { width:38px; height:38px; border-radius:12px; background:var(--site-secondary); display:grid; place-items:center; font-size:18px; flex:none; }
.goal-main { min-width:0; flex:1; }
.goal-title { font-weight:750; font-size:14px; }
.goal-meta { font-size:11px; color:light-dark(#758179,#aab5ad); margin:3px 0 7px; }
.goal-value { font-size:12px; font-weight:700; white-space:nowrap; }
.btn { border:0; background:var(--site-primary); color:var(--site-on-primary); border-radius:12px; padding:11px 14px; font-weight:700; font-size:13px; }
.btn.secondary { background:var(--site-secondary); color:var(--site-on-secondary); }
.btn.ghost { background:transparent; color:var(--site-primary); padding:7px 9px; }
.btn.danger { background:#f8e9e6; color:#a34232; }
.full { width:100%; }
.empty { text-align:center; padding:30px 14px; color:light-dark(#748078,#aab5ad); }
.empty b { display:block; color:var(--site-on-background); margin-bottom:6px; }
.date-line { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.date-line input { border:1px solid light-dark(#dce4dc,#46534a); border-radius:10px; background:transparent; color:inherit; padding:8px; }
.task { display:flex; align-items:center; gap:11px; padding:13px 0; border-bottom:1px solid light-dark(#edf0ec,#354139); }
.task:last-child { border-bottom:0; }
.check { width:25px; height:25px; border:1.8px solid #9eaaa1; border-radius:50%; display:grid; place-items:center; background:transparent; color:white; flex:none; padding:0; }
.check.done { background:#4d9471; border-color:#4d9471; }
.task-info { flex:1; min-width:0; }
.task-title { font-size:14px; font-weight:700; }
.task-title.done { text-decoration:line-through; color:light-dark(#89938b,#89968d); }
.task-sub { color:light-dark(#7b877e,#a6b1a8); font-size:11px; margin-top:3px; }
.pill { font-size:10px; border-radius:99px; padding:4px 8px; background:var(--site-secondary); color:var(--site-on-secondary); white-space:nowrap; }
.icon-btn { border:0; background:transparent; color:light-dark(#68756c,#b5c0b7); padding:5px; font-size:17px; }
.inline-form { display:flex; gap:8px; margin-top:12px; }
.inline-form input { flex:1; min-width:0; }
input, select, textarea { width:100%; border:1px solid light-dark(#dce4dc,#46534a); border-radius:11px; background:light-dark(#fff,#172019); color:var(--site-on-background); padding:11px 12px; }
label { display:block; font-size:12px; font-weight:700; margin:12px 0 6px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.modal-backdrop { position:fixed; inset:0; background:#101b15a8; z-index:20; display:none; align-items:flex-end; justify-content:center; }
.modal-backdrop.show { display:flex; }
.modal { background:light-dark(#fff,#202a24); color:var(--site-on-background); width:min(100%,560px); border-radius:22px 22px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom)); max-height:90vh; overflow:auto; }
.modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.modal-head h2 { font-size:19px; }
.modal-actions { display:flex; gap:8px; margin-top:18px; }
.modal-actions button { flex:1; }
.chart-bars { display:flex; align-items:flex-end; gap:8px; height:145px; padding:12px 3px 0; border-bottom:1px solid light-dark(#dfe6df,#3d4940); }
.bar-col { flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:6px; min-width:0; }
.bar { width:min(100%,32px); background:#78a88a; border-radius:7px 7px 2px 2px; min-height:3px; }
.bar-label { font-size:10px; color:light-dark(#77847a,#a9b5aa); }
.streak { display:flex; gap:5px; flex-wrap:wrap; margin-top:10px; }
.streak i { width:13px; height:13px; border-radius:4px; background:light-dark(#e8ede8,#3a453d); }
.streak i.on { background:#4d9471; }
.category-line { display:flex; align-items:center; gap:10px; margin:13px 0; }
.category-line .name { width:74px; font-size:12px; font-weight:700; }
.category-line .progress { flex:1; }
.category-line .percent { width:36px; text-align:right; font-size:12px; }
.filter-row { display:flex; gap:7px; overflow-x:auto; padding:2px 0 10px; }
.filter-chip { border:1px solid light-dark(#dce4dc,#46534a); background:transparent; color:inherit; border-radius:99px; padding:7px 11px; white-space:nowrap; font-size:11px; }
.filter-chip.active { background:var(--site-primary); border-color:var(--site-primary); color:var(--site-on-primary); }
.task-category { display:inline-flex; align-items:center; gap:4px; font-size:10px; color:light-dark(#607469,#b4c2b7); margin-top:4px; }
.bulk-tools { display:flex; gap:7px; align-items:center; margin:4px 0 12px; }
.bulk-tools select { flex:1; min-width:0; padding:8px; font-size:12px; }
.bulk-tools button { padding:9px 10px; white-space:nowrap; }
.task-select { width:17px; height:17px; flex:none; accent-color:var(--site-primary); }
.note { background:var(--site-secondary); color:var(--site-on-secondary); border-radius:12px; padding:12px; font-size:12px; line-height:1.65; }
.category-edit-row { display:flex; align-items:center; gap:7px; margin:9px 0; }
.category-edit-row input { flex:1; min-width:0; padding:9px; }
.category-edit-row button { flex:none; padding:8px 10px; }
.weekday-options { display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 12px; }
.weekday-options label { display:flex; align-items:center; gap:5px; margin:0; padding:7px 9px; border:1px solid light-dark(#dce4dc,#46534a); border-radius:10px; font-weight:500; }
.weekday-options input { width:auto; }
.goal-actions { display:flex; gap:6px; align-items:center; }
.goal-actions .btn { padding:7px 9px; font-size:11px; white-space:nowrap; }
.bottom-note { text-align:center; color:light-dark(#89948c,#9eaaa1); font-size:10px; padding:14px 0 4px; }
@media (min-width:600px) { .modal-backdrop { align-items:center; padding:20px; } .modal { border-radius:22px; } }
@media (prefers-color-scheme:dark) { .topbar { background:#263f33; } }
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="topline">
      <div><div class="brand">Habit Log</div><div class="subbrand">小さな行動を、続く習慣に。</div></div>
      <div class="month-nav"><button id="prevMonth" aria-label="前月">‹</button><strong id="headerMonth"></strong><button id="nextMonth" aria-label="翌月">›</button></div>
    </div>
  </header>
  <main>
    <nav class="tabs" aria-label="メインメニュー">
      <button class="tab active" data-tab="month"><span>▦</span>月間目標</button>
      <button class="tab" data-tab="today"><span>✓</span>今日のToDo</button>
      <button class="tab" data-tab="analysis"><span>▥</span>分析</button>
      <button class="tab" data-tab="review"><span>✎</span>振り返り</button>
    </nav>
    <section id="monthPanel" class="panel"></section>
    <section id="todayPanel" class="panel" hidden></section>
    <section id="analysisPanel" class="panel" hidden></section>
    <section id="reviewPanel" class="panel" hidden></section>
    <div class="bottom-note">データはこのブラウザ内に保存されます。定期的にバックアップしてください。</div>
  </main>
</div>
<div class="modal-backdrop" id="modalBackdrop"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h2 id="modalTitle"></h2><button class="icon-btn" id="closeModal" aria-label="閉じる">✕</button></div><div id="modalBody"></div></div></div>
<script>
(() => {
  const $ = (s, root=document) => root.querySelector(s);
  const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const parseDate = s => new Date(`${s}T12:00:00`);
  const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const monthKey = s => s.slice(0,7);
  const fmtMonth = s => { const [y,m]=s.split('-'); return `${y}年${Number(m)}月`; };
  const fmtDate = s => { const d=parseDate(s); return `${d.getMonth()+1}月${d.getDate()}日（${'日月火水木金土'[d.getDay()]}）`; };
  const uid = () => Math.random().toString(36).slice(2,10);
  const defaultCategories = ['未分類','運動','勉強','健康','生活','趣味','家庭菜園','家族','仕事','その他'];
  const defaultState = () => ({ goals:[], tasks:[], reviews:{}, categories:[...defaultCategories], selectedDate:todayISO(), viewMonth:monthKey(todayISO()) });
  let state = defaultState();
  let activeTab = 'month';
  let monthTaskFilter = 'すべて';
  let selectedTaskIds = new Set();
  let db = null;
  const save = async () => {
    if (db) return new Promise((resolve,reject)=>{ const tx=db.transaction('state','readwrite'); tx.objectStore('state').put(state,'main'); tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error); });
    localStorage.setItem('habit-log-fallback',JSON.stringify(state));
  };
  const load = async () => {
    if (!('indexedDB' in window)) { try { state=JSON.parse(localStorage.getItem('habit-log-fallback'))||defaultState(); } catch {} return; }
    db=await new Promise((resolve,reject)=>{ const req=indexedDB.open('HabitLogDB',1); req.onupgradeneeded=()=>req.result.createObjectStore('state'); req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error); });
    state=await new Promise(resolve=>{ const tx=db.transaction('state','readonly'); const req=tx.objectStore('state').get('main'); req.onsuccess=()=>resolve(req.result||defaultState()); req.onerror=()=>resolve(defaultState()); });
    if(!Array.isArray(state.categories))state.categories=[...defaultCategories];
    state.categories=[...new Set(['未分類',...state.categories.filter(c=>typeof c==='string'&&c.trim()).map(c=>c.trim())])];
  };
  const goalsForMonth = () => state.goals.filter(g=>g.month===state.viewMonth && !g.archived);
  const goalById = id => state.goals.find(g=>g.id===id);
  const tasksForDate = date => state.tasks.filter(t=>t.date===date && !t.deleted);
  const monthTasks = () => state.tasks.filter(t=>monthKey(t.date)===state.viewMonth && !t.deleted);
  const doneTasks = tasks => tasks.filter(t=>t.status==='done');
  const pct = (a,b) => b ? Math.round(a/b*100) : 0;
  const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const goalProgress = g => {
    const tasks=state.tasks.filter(t=>t.goalId===g.id && monthKey(t.date)===g.month && !t.deleted && t.status==='done');
    if (g.unit==='時間') return tasks.reduce((n,t)=>n+(Number(t.minutes)||0),0);
    if (g.unit==='日') return new Set(tasks.map(t=>t.date)).size;
    return tasks.length;
  };
  const unitLabel = g => g.unit==='時間'?'分':g.unit==='日'?'日':'回';
  const displayProgress = g => g.unit==='時間' ? `${(goalProgress(g)/60).toFixed(goalProgress(g)%60===0?0:1)}時間` : `${goalProgress(g)}${unitLabel(g)}`;
  const goalTargetDisplay = g => g.unit==='時間' ? `${g.target}時間` : `${g.target}${unitLabel(g)}`;
  const goalPercent = g => pct(goalProgress(g),g.unit==='時間'?g.target*60:g.target);
  const render = () => { $('#headerMonth').textContent=fmtMonth(state.viewMonth); renderMonth(); renderToday(); renderAnalysis(); renderReview(); document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab)); ['month','today','analysis','review'].forEach(t=>$('#'+t+'Panel').hidden=t!==activeTab); };
  const renderMonth = () => {
    const goals=goalsForMonth(), tasks=monthTasks(), done=doneTasks(tasks);
    const scheduled=tasks.length, rate=pct(done.length,scheduled);
    $('#monthPanel').innerHTML=`<div class="section-head"><div><h1>${fmtMonth(state.viewMonth)}の目標</h1><div class="muted small">月間目標を決めて、日々の行動につなげよう</div></div><button class="btn" id="addGoal">＋ 目標追加</button></div>
      <div class="summary-grid"><div class="metric"><strong>${goals.length}</strong><span>目標数</span></div><div class="metric"><strong>${done.length}/${scheduled}</strong><span>完了ToDo</span></div><div class="metric"><strong>${rate}%</strong><span>予定達成率</span></div></div>
      <div class="card"><div class="section-head"><h2>今月の目標一覧</h2><span class="muted small">進捗は完了記録から自動集計</span></div>
      ${goals.length?goals.map(g=>{const p=goalPercent(g);return `<div class="goal-row"><div class="goal-icon">${esc(g.icon||'✦')}</div><div class="goal-main"><div class="goal-title">${esc(g.name)}</div><div class="goal-meta">${esc(g.category)} ・ 目標 ${goalTargetDisplay(g)}</div><div class="progress"><i style="width:${Math.min(100,p)}%"></i></div></div><div class="goal-value">${displayProgress(g)}<div class="muted small" style="text-align:right">${p}%</div></div><div class="goal-actions"><button class="btn secondary" data-goal-todo="${g.id}">ToDo化</button><button class="icon-btn" data-edit-goal="${g.id}" aria-label="編集">⋯</button></div></div>`}).join(''):`<div class="empty"><b>まだ月間目標がありません</b>最初の目標を登録してみましょう。</div>`}</div>
      <div class="note">💡 月間目標のほか、思いついたToDoも自由に登録できます。カテゴリーは下の「カテゴリーを編集」から追加・変更できます。</div>
      <div class="section-head" style="margin-top:14px"><h2>カテゴリー設定</h2><button class="btn secondary" id="manageCategories">カテゴリーを編集</button></div>
      <div class="section-head" style="margin-top:22px"><div><h2>月間ToDo一覧</h2><div class="muted small">カテゴリーは後から設定・変更できます</div></div><button class="btn" id="addMonthTask">＋ ToDo追加</button></div>
      <div class="card"><div class="filter-row" id="monthTaskFilters"></div><div id="monthTaskList"></div></div>`;
    $('#addGoal').onclick=()=>openGoalModal();
    document.querySelectorAll('[data-edit-goal]').forEach(b=>b.onclick=()=>openGoalModal(goalById(b.dataset.editGoal)));
    document.querySelectorAll('[data-goal-todo]').forEach(b=>b.onclick=()=>openGoalTodoModal(goalById(b.dataset.goalTodo)));
    $('#addMonthTask').onclick=()=>openTaskModal(state.viewMonth+'-01');
    $('#manageCategories').onclick=openCategoryModal;
    renderMonthTaskList();
  };
  const taskCategory = t => t.category || (goalById(t.goalId)?.category) || '未分類';
  const renderMonthTaskList = () => {
    const tasks=monthTasks().slice().sort((a,b)=>a.date.localeCompare(b.date));
    const cats=['すべて',...state.categories];
    $('#monthTaskFilters').innerHTML=cats.map(c=>`<button class="filter-chip ${monthTaskFilter===c?'active':''}" data-month-filter="${esc(c)}">${esc(c)}</button>`).join('');
    const filtered=monthTaskFilter==='すべて'?tasks:tasks.filter(t=>taskCategory(t)===monthTaskFilter);
    $('#monthTaskList').innerHTML=`<div class="bulk-tools"><select id="bulkCategory"><option value="">選択したToDoのカテゴリーを変更</option>${state.categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select><button class="btn secondary" id="applyBulkCategory">一括設定</button></div>`+(filtered.length?filtered.map(t=>`<div class="task"><input class="task-select" type="checkbox" data-select-task="${t.id}" ${selectedTaskIds.has(t.id)?'checked':''} aria-label="${esc(t.title)}を選択"><button class="check ${t.status==='done'?'done':''}" data-toggle-task="${t.id}">${t.status==='done'?'✓':''}</button><div class="task-info"><div class="task-title ${t.status==='done'?'done':''}">${esc(t.title)}</div><div class="task-sub">${fmtDate(t.date)}${goalById(t.goalId)?' ・ '+esc(goalById(t.goalId).name):''}</div><div class="task-category">● ${esc(taskCategory(t))}</div></div><span class="pill">${t.status==='done'?'完了':'未完了'}</span><button class="icon-btn" data-task-menu="${t.id}">⋯</button></div>`).join(''):'<div class="empty"><b>該当するToDoはありません</b>＋ToDo追加から登録できます。</div>');
    document.querySelectorAll('[data-select-task]').forEach(b=>b.onchange=()=>{if(b.checked)selectedTaskIds.add(b.dataset.selectTask);else selectedTaskIds.delete(b.dataset.selectTask);});
    $('#applyBulkCategory').onclick=async()=>{const category=$('#bulkCategory').value;if(!category){toast('カテゴリーを選択してください');return;}if(!selectedTaskIds.size){toast('ToDoを選択してください');return;}state.tasks.filter(t=>selectedTaskIds.has(t.id)).forEach(t=>t.category=category);selectedTaskIds.clear();await save();render();toast('カテゴリーを一括設定しました');};
    document.querySelectorAll('[data-month-filter]').forEach(b=>b.onclick=()=>{monthTaskFilter=b.dataset.monthFilter;renderMonthTaskList();});
    document.querySelectorAll('[data-toggle-task]').forEach(b=>b.onclick=()=>toggleTask(b.dataset.toggleTask));
    document.querySelectorAll('[data-task-menu]').forEach(b=>b.onclick=()=>openTaskActions(b.dataset.taskMenu));
  };
  const openCategoryModal = () => {
    const draw=()=>{
      $('#modalBody').innerHTML=`<p class="muted small">カテゴリー名の変更は登録済みの目標・ToDoにも反映されます。削除したカテゴリーの記録は「未分類」に移動します。</p>${state.categories.map((c,i)=>`<div class="category-edit-row"><input data-category-name="${i}" value="${esc(c)}" ${c==='未分類'?'disabled':''}><button class="btn secondary" data-save-category="${i}" ${c==='未分類'?'disabled':''}>変更</button><button class="btn danger" data-delete-category="${i}" ${c==='未分類'?'disabled':''}>削除</button></div>`).join('')}<form id="newCategoryForm"><label>カテゴリーを追加</label><div class="inline-form"><input id="newCategoryName" maxlength="20" placeholder="例：家庭菜園" required><button class="btn" type="submit">追加</button></div></form>`;
      document.querySelectorAll('[data-save-category]').forEach(b=>b.onclick=async()=>{const i=Number(b.dataset.saveCategory),old=state.categories[i],name=$(`[data-category-name="${i}"]`).value.trim();if(!name){toast('カテゴリー名を入力してください');return;}if(state.categories.some((c,j)=>j!==i&&c===name)){toast('同じ名前のカテゴリーがあります');return;}state.categories[i]=name;state.goals.forEach(g=>{if(g.category===old)g.category=name;});state.tasks.forEach(t=>{if(t.category===old)t.category=name;});await save();draw();render();toast('カテゴリー名を変更しました');});

  const moveDate = delta => { const d=parseDate(state.selectedDate); d.setDate(d.getDate()+delta); state.selectedDate=iso(d); state.viewMonth=monthKey(state.selectedDate); save().then(render); };
  const toggleTask = async id => { const t=state.tasks.find(x=>x.id===id); if(!t)return; t.status=t.status==='done'?'open':'done'; t.completedAt=t.status==='done'?new Date().toISOString():null; await save(); render(); };
  const renderAnalysis = () => {

  const streakForGoal = g => { let d=parseDate(todayISO()), count=0; const todayTasks=state.tasks.filter(t=>t.goalId===g.id&&t.date===iso(d)&&t.status==='done'); if(!todayTasks.length)d.setDate(d.getDate()-1); for(let i=0;i<370;i++){const s=iso(d),ts=state.tasks.filter(t=>t.goalId===g.id&&t.date===s&&!t.deleted);if(ts.some(t=>t.status==='done')){count++;d.setDate(d.getDate()-1);}else break;} return count; };
  const renderReview = () => { const r=state.reviews[state.viewMonth]||{}; const goals=goalsForMonth(); $('#reviewPanel').innerHTML=`<div class="section-head"><div><h1>月間振り返り</h1><div class="muted small">できたことを確認し、次の月につなげる</div></div></div><div class="card"><div class="summary-grid"><div class="metric"><strong>${goals.length}</strong><span>目標数</span></div><div class="metric"><strong>${doneTasks(monthTasks()).length}</strong><span>完了ToDo</span></div><div class="metric"><strong>${pct(doneTasks(monthTasks()).length,monthTasks().length)}%</strong><span>達成率</span></div></div><label for="reviewGood">今月できたこと</label><textarea id="reviewGood" rows="3" placeholder="例：読書を週4日続けられた">${esc(r.good||'')}</textarea><label for="reviewImprove">改善したいこと</label><textarea id="reviewImprove" rows="3" placeholder="例：英語学習の時間を朝に確保する">${esc(r.improve||'')}</textarea><label for="reviewNext">来月に向けて</label><textarea id="reviewNext" rows="3" placeholder="次の月に取り組みたいこと">${esc(r.next||'')}</textarea><button class="btn full" id="saveReview" style="margin-top:14px">振り返りを保存</button></div><div class="card"><h2>翌月の準備</h2><p class="muted small">今月の目標を翌月にコピーできます。コピー後に目標回数などを調整できます。</p><button class="btn secondary full" id="copyGoals">翌月に目標をコピー</button></div>`;
    $('#saveReview').onclick=async()=>{state.reviews[state.viewMonth]={good:$('#reviewGood').value,improve:$('#reviewImprove').value,next:$('#reviewNext').value};await save();toast('振り返りを保存しました');};
    $('#copyGoals').onclick=()=>{const [y,m]=state.viewMonth.split('-').map(Number),d=new Date(y,m,1),next=monthKey(iso(d));const existing=state.goals.filter(g=>g.month===next);if(existing.length&&!confirm('翌月には既に目標があります。追加でコピーしますか？'))return;goals.forEach(g=>state.goals.push({...g,id:uid(),month:next,createdAt:new Date().toISOString()}));state.viewMonth=next;save().then(render);toast('翌月に目標をコピーしました');};

  const openModal = (title,html,onReady) => { $('#modalTitle').textContent=title; $('#modalBody').innerHTML=html; $('#modalBackdrop').classList.add('show'); $('#closeModal').onclick=closeModal; $('#modalBackdrop').onclick=e=>{if(e.target===$('#modalBackdrop'))closeModal();}; if(onReady)onReady(); };

  const openGoalModal = g => { const editing=!!g; openModal(editing?'目標を編集':'月間目標を追加',`<form id="goalForm"><label>目標名</label><input id="goalName" required maxlength="50" placeholder="例：読書" value="${esc(g?.name||'')}"><div class="form-grid"><div><label>カテゴリー</label><select id="goalCategory">${state.categories.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div><label>アイコン</label><select id="goalIcon"><option value="📚">📚 勉強</option><option value="💪">💪 運動</option><option value="🌱">🌱 家庭菜園</option><option value="💰">💰 お金</option><option value="📖">📖 読書</option><option value="✦">✦ その他</option><option value="🧘">🧘 健康</option><option value="🏠">🏠 生活・家庭</option><option value="🌍">🌍 旧アイコン</option><option value="✍️">✍️ 旧アイコン</option></select></div></div><div class="form-grid"><div><label>月間目標値</label><input id="goalTarget" type="number" min="1" max="9999" required value="${g?.target||12}"></div><div><label>単位</label><select id="goalUnit"><option value="回">回数</option><option value="時間">時間</option><option value="日">日数</option></select></div></div><label>メモ（任意）</label><textarea id="goalMemo" rows="2" placeholder="この目標を続ける理由など">${esc(g?.memo||'')}</textarea><div class="modal-actions">${editing?'<button type="button" class="btn danger" id="deleteGoal">削除</button>':''}<button class="btn" type="submit">保存する</button></div></form>`,()=>{

  const openGoalTodoModal = g => {
    if(!g)return;

  const openTaskActions = id => { const t=state.tasks.find(x=>x.id===id);if(!t)return;openModal('ToDoの操作',`<div class="note"><b>${esc(t.title)}</b><br>${fmtDate(t.date)} ・ ${t.status==='done'?'完了':'未完了'}<br>カテゴリー：${esc(taskCategory(t))}</div><div style="display:grid;gap:9px;margin-top:15px"><button class="btn secondary" id="editTask">内容・日付・カテゴリーを編集</button><button class="btn secondary" id="moveTomorrow">翌日に移動</button><button class="btn secondary" id="carryTask">別の日に移動</button><button class="btn danger" id="deleteTask">削除する</button></div>`,()=>{

      document.querySelectorAll('[data-carry-one]').forEach(b=>b.onclick=async()=>{const t=state.tasks.find(x=>x.id===b.dataset.carryOne);if(t)t.date=todayISO();state.selectedDate=todayISO();state.viewMonth=monthKey(todayISO());await save();closeModal();render();});

    });
  };
  const toast = msg => { const el=document.createElement('div');el.textContent=msg;Object.assign(el.style,{position:'fixed',bottom:'calc(95px + env(safe-area-inset-bottom))',left:'50%',transform:'translateX(-50%)',background:'#263f33',color:'#fff',padding:'11px 16px',borderRadius:'12px',fontSize:'13px',zIndex:50,boxShadow:'0 5px 20px #0003'});document.body.append(el);setTimeout(()=>el.remove(),2200); };

  const start = async()=>{try{await load();}catch(e){console.error(e);try{state=JSON.parse(localStorage.getItem('habit-log-fallback'))||defaultState();}catch{state=defaultState();}}render();showCarryPrompt();};
